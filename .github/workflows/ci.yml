name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      verification_mode:
        type: choice
        default: auto
        options: [auto, full, bypass-expensive]
      verification_reason:
        type: string
        default: ''
      acknowledge_failures:
        type: string
        default: ''
  schedule:
    - cron: '17 2 * * *'
permissions:
  contents: read
jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.policy.outputs.eligible }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - id: policy
        run: echo "eligible=$(node scripts/playtest/ci-verification.mjs route)" >> "$GITHUB_OUTPUT"
  automated:
    needs: route
    if: needs.route.outputs.eligible != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SIMULACRUM_HOST_PROFILE: github-ubuntu-2cpu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      # `npm run ci` runs the same prettier --check through the every-commit format gate.
      - run: npm run ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unit-verification
          path: |
            artifacts/
            !artifacts/remote-playtest/**
            !artifacts/playtest-cloud/**
            !artifacts/**/trace.zip
  browser:
    needs: route
    if: needs.route.outputs.eligible != 'true'
    runs-on: ubuntu-latest
    # Measurement mode: long enough for every check to complete at the provisional caps
    # (registered per-check budgets shrink this once measured).
    timeout-minutes: 300
    env:
      SIMULACRUM_HOST_PROFILE: github-ubuntu-2cpu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium chrome
      - run: xvfb-run --auto-servernum node scripts/verify-ci-browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-verification
          path: |
            artifacts/
            !artifacts/remote-playtest/**
            !artifacts/playtest-cloud/**
            !artifacts/**/trace.zip

  release-package:
    needs: route
    if: needs.route.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      eligible: ${{ needs.route.outputs.eligible }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium chrome
      - run: xvfb-run --auto-servernum npm run release:prepare -- .release-private/ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-package
          retention-days: 14
          path: |
            .release-private/ci/release.json
            .release-private/ci/payload/
          include-hidden-files: true
  verification:
    if: always()
    needs: [route, automated, browser, release-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - run: node scripts/playtest/ci-verification.mjs assert
        env:
          VERIFICATION_JOBS: ${{ toJSON(needs) }}
  staging-admission:
    needs: [release-package, verification]
    if: needs.release-package.outputs.eligible == 'true' && vars.DEPLOY_STAGING_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-package
          path: .release-private/ci
      - run: node scripts/playtest/ci-release.mjs preflight staging
        env:
          GH_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
          PLAYTEST_CONTROL_TOKEN: ${{ secrets.STAGING_CONTROL_TOKEN }}
          CALIBRATION_BUNDLE_TOKEN: ${{ secrets.CALIBRATION_BUNDLE_TOKEN }}
          RELEASE_CONFIG: ${{ vars.STAGING_RELEASE_CONFIG }}
          RELEASE_VERIFICATION_MODE: ${{ inputs.verification_mode || 'auto' }}
          RELEASE_VERIFICATION_REASON: ${{ inputs.verification_reason }}
          RELEASE_ACKNOWLEDGE_FAILURES: ${{ inputs.acknowledge_failures }}
  staging-deploy:
    needs: staging-admission
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-package
          path: .release-private/ci
      - run: npx playwright install --with-deps chromium chrome
      - run: xvfb-run --auto-servernum node scripts/playtest/ci-release.mjs deploy staging
        env:
          GH_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PLAYTEST_ADMIN_TOKEN: ${{ secrets.PLAYTEST_ADMIN_TOKEN }}
          PLAYTEST_CONTROL_TOKEN: ${{ secrets.STAGING_CONTROL_TOKEN }}
          CALIBRATION_BUNDLE_TOKEN: ${{ secrets.CALIBRATION_BUNDLE_TOKEN }}
          RELEASE_CONFIG: ${{ vars.STAGING_RELEASE_CONFIG }}
          RELEASE_VERIFICATION_MODE: ${{ inputs.verification_mode || 'auto' }}
          RELEASE_VERIFICATION_REASON: ${{ inputs.verification_reason }}
          RELEASE_ACKNOWLEDGE_FAILURES: ${{ inputs.acknowledge_failures }}
      - if: always()
        run: node scripts/playtest/experiment-transport.mjs .release-private/ci staging
        env:
          RELEASE_JOB_STATUS: ${{ job.status }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: experiment-evidence
          retention-days: 30
          if-no-files-found: error
          path: .release-private/ci/experiment-transport.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-verification
          retention-days: 14
          path: .release-private/ci/verified-staging.json
