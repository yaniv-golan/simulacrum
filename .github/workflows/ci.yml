name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run security:audit
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Run representative browser and simulation smoke tests
        env:
          TEST_FILTER: verify-five-demos,verify-adaptive-workspace,verify-accessibility
          TEST_SUITE_TIMEOUT_MS: 480000
          TEST_AGGREGATE_TIMEOUT_MS: 1200000
        run: npm test
      - run: npm run build
