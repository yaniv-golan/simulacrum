name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
jobs:
  automated:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-verification
          path: artifacts/
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium chrome
      - run: xvfb-run --auto-servernum npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: artifacts/
